name: Generate Royal Phoenix GLB

on:
  push:
    branches:
      - feat/royal-phoenix-3d-lab
    paths:
      - scripts/build_phoenix_glb.py
      - .github/workflows/generate-phoenix-glb.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/royal-phoenix-3d-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model generator dependencies
        run: pip install "trimesh==4.11.1" "numpy==2.3.5"
      - name: Generate and validate GLB
        run: python scripts/build_phoenix_glb.py
      - name: Commit generated model
        run: |
          if [ -z "$(git status --porcelain -- models/royal-phoenix-v1.glb)" ]; then
            echo "GLB is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/royal-phoenix-v1.glb
          git commit -m "build: generate Royal Phoenix GLB"
          git push
