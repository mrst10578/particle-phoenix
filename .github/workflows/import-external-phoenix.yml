name: Import External Phoenix Asset

on:
  push:
    branches: [main]
    paths:
      - ".github/import-external-phoenix.trigger"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download optimized CC-BY Phoenix from Dropbox staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -L --fail --silent --show-error 'https://ucc999a921b7aa3d899e63bb27ef.dl.dropboxusercontent.com/cd/0/get/DI0icehBdvhQGRdhzGWWQU3dF6Wx4QAnURM3bE6l1w-FS8tOTkC_-vLx1ITuQJme_dZGzWn7IhxSyAJ8UTchW3dmbWhsgoAGm8M9dK40m1rUGsKgID-jZEpkGlV2EZAxJmZgRjVhUTGWFK7bxM-VHg7sGhv36QXhvjOfdXvkpGBLuA/file?c_luid=e2a8d15f' \
            -o models/royal-phoenix-external-v1.glb
          test "$(stat -c%s models/royal-phoenix-external-v1.glb)" -eq 5228212
          echo "701191ed14be5c006a0479db49f9eaded0141f96ef9da644cb58fcf67f9d1e25  models/royal-phoenix-external-v1.glb" | sha256sum -c -

      - name: Commit external Phoenix asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/royal-phoenix-external-v1.glb
          git commit -m "assets: add external Royal Phoenix model"
          git push origin HEAD:main
