name: Import Phoenix Reference Pack

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-phoenix-reference-pack.yml"

permissions:
  contents: write

jobs:
  import-reference-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Phoenix reference pack from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p references/phoenix
          curl -L --fail --silent --show-error 'https://uc2ae88ba5d96b0215fafaeab4ae.dl.dropboxusercontent.com/cd/0/get/DI0pTnMQBg4vb9xnia5KY5TjTWsdYbSxOF5xfxDimp2DN6kR_w1iCwnz8kFcvRtQQ170eJS4SRioyBKVUYtV8sHvnfrEFIk8wTY1DXGc4LM78D51WE8gbLAtVlnYI1V3tth0f3nDpfqaZTDFR2gpgMakaNRD0xBRrrqE9BHDZHUBmQ/file?c_luid=e2a8d15f' \
            -o references/phoenix/LoPRax_Phoenix_3D_Reference_Pack.zip
          test "$(stat -c%s references/phoenix/LoPRax_Phoenix_3D_Reference_Pack.zip)" -eq 20904095

      - name: Commit reference pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/phoenix/LoPRax_Phoenix_3D_Reference_Pack.zip
          git commit -m "assets: add Phoenix 3D reference pack"
          git push origin HEAD:main
