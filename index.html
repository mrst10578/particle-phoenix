<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050203">
  <meta name="color-scheme" content="dark">
  <title>LoPRax Royal Phoenix 3D Lab</title>
  <meta name="description" content="Independent real-time 3D and particle R&D lab for the LoPRax royal phoenix visual system.">
  <link rel="stylesheet" href="./src/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="viewport" data-viewport aria-label="Interactive 3D phoenix viewport"></main>
  <div class="vignette" aria-hidden="true"></div>

  <header class="brand">
    <strong>LoPRax</strong>
    <span>Royal Phoenix · 3D Visual Lab</span>
  </header>

  <div class="hint">Drag to orbit · pinch/wheel to zoom · 1/2/3/4 morph · R reset</div>

  <footer class="asset-credit">
    Phoenix model:
    <a href="https://sketchfab.com/3d-models/phoenix-1af2002062964ca198f8fcc57dbeb528" target="_blank" rel="noopener noreferrer">rononono / Sketchfab</a>
    · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY</a>
    · modified for LoPRax
  </footer>

  <div class="loading" data-loading>
    <div class="loading-inner">
      <div class="loading-mark" aria-hidden="true"></div>
      <strong>ROYAL PHOENIX</strong>
      <small>Forging the 3D form…</small>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
