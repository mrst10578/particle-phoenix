<script>
(function() {
// ==================== DOM Elements ====================
const loadingOverlay = document.getElementById('loading-overlay');
const cameraPrompt = document.getElementById('camera-prompt');
const camDot = document.getElementById('cam-dot');
const camText = document.getElementById('cam-text');
const instructions = document.getElementById('instructions');

// ==================== Constants ====================
const PARTICLE_COUNT = 5000;
const ROSE_CENTER_Y = -0.5;
const SCATTER_RADIUS = 13;
const SCATTER_INNER = 4;
const MAX_ROTATION_SPEED = 30 * (Math.PI / 180); // 30 deg/s in radians
const BREATH_AMPLITUDE = 0.05;
const BREATH_PERIOD = 3;
const INITIAL_ANIM_DURATION = 2000; // ms

// ==================== Rose Geometry Generator ====================
function randomRange(min, max) { return min + Math.random() * (max - min); }

function lerpColor(c1, c2, t) {
    return [
        c1[0] + (c2[0] - c1[0]) * t,
        c1[1] + (c2[1] - c1[1]) * t,
        c1[2] + (c2[2] - c1[2]) * t
    ];
}

function hexToRGB(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

// Petal layer parameters
const PETAL_COLORS = {
    inner: hexToRGB('#ff0066'),
    outer: hexToRGB('#cc0055'),
    sepal:  hexToRGB('#00cc66'),
    stem:   hexToRGB('#00cc66'),
    leaf:   hexToRGB('#009944')
};

// Golden angle for natural spiral phyllotaxis (~137.5°)
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // 2π * (1 - 1/φ) ≈ 2.400 rad

// 7 concentric layers totaling ~52 petals — dense, realistic rose bloom
// Higher cup values → petals curve inward toward center (concave bowl shape)
// Reduced arch/tilt → petals stay more upright, creating a deeper cup
const LAYER_DEFS = [
    // Layer 0: heart — tiny tightly-wrapped bud center, deepest crimson
    { petals: 7, count: 500, baseR: 0.06, tipR: 0.30, baseH: 1.05, tipH: 1.7,
      arch: 0.06, spread: 0.05, cup: 0.42, tilt: 0.08, recurve: 0.00, bowHeight: 0.06,
      angleOffset: 0,
      colorStart: hexToRGB('#990033'), colorEnd: hexToRGB('#880022') },
    // Layer 1: inner core — dense small petals, very deep red
    { petals: 7, count: 550, baseR: 0.12, tipR: 0.55, baseH: 0.80, tipH: 2.0,
      arch: 0.12, spread: 0.08, cup: 0.38, tilt: 0.15, recurve: 0.01, bowHeight: 0.12,
      angleOffset: GOLDEN_ANGLE * 0.38,
      colorStart: hexToRGB('#bb0033'), colorEnd: hexToRGB('#990028') },
    // Layer 2: inner-mid — opening buds, rich crimson red
    { petals: 8, count: 600, baseR: 0.22, tipR: 0.90, baseH: 0.50, tipH: 2.2,
      arch: 0.22, spread: 0.11, cup: 0.34, tilt: 0.25, recurve: 0.03, bowHeight: 0.18,
      angleOffset: GOLDEN_ANGLE * 1.20,
      colorStart: hexToRGB('#dd0038'), colorEnd: hexToRGB('#bb0030') },
    // Layer 3: middle — classic rose bloom, rich red
    { petals: 8, count: 630, baseR: 0.35, tipR: 1.40, baseH: 0.15, tipH: 2.4,
      arch: 0.38, spread: 0.17, cup: 0.28, tilt: 0.38, recurve: 0.06, bowHeight: 0.28,
      angleOffset: GOLDEN_ANGLE * 2.00,
      colorStart: hexToRGB('#ee0044'), colorEnd: hexToRGB('#cc0038') },
    // Layer 4: mid-outer — half-open, vibrant rose red
    { petals: 8, count: 630, baseR: 0.55, tipR: 1.95, baseH: -0.30, tipH: 2.2,
      arch: 0.58, spread: 0.24, cup: 0.22, tilt: 0.50, recurve: 0.12, bowHeight: 0.36,
      angleOffset: GOLDEN_ANGLE * 2.70,
      colorStart: hexToRGB('#ff0055'), colorEnd: hexToRGB('#dd0044') },
    // Layer 5: outer — open petals with noticeable recurve
    { petals: 8, count: 600, baseR: 0.80, tipR: 2.55, baseH: -0.85, tipH: 1.8,
      arch: 0.80, spread: 0.30, cup: 0.15, tilt: 0.60, recurve: 0.22, bowHeight: 0.42,
      angleOffset: GOLDEN_ANGLE * 3.40,
      colorStart: hexToRGB('#ff1166'), colorEnd: hexToRGB('#ee0050') },
    // Layer 6: guard — fully spread outer petals, prominent recurve, soft rose-pink
    { petals: 7, count: 490, baseR: 1.05, tipR: 3.10, baseH: -1.40, tipH: 1.3,
      arch: 1.00, spread: 0.38, cup: 0.08, tilt: 0.68, recurve: 0.40, bowHeight: 0.44,
      angleOffset: GOLDEN_ANGLE * 4.20,
      colorStart: hexToRGB('#ff2277'), colorEnd: hexToRGB('#ff0060') }
];

// Petal total: 500+550+600+630+630+600+490 = 4000
// + Sepal 350 + Stem 350 + Leaves 300 = 5000

function generateRoseGeometry() {
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const types = new Uint8Array(PARTICLE_COUNT); // 0=petal, 1=sepal, 2=stem, 3=leaf
    let idx = 0;

    // --- Petals ---
    for (const layer of LAYER_DEFS) {
        const perPetal = Math.floor(layer.count / layer.petals);
        for (let p = 0; p < layer.petals; p++) {
            // Per-petal organic variation
            const jitter = (Math.random() - 0.5) * 0.06;
            const petalAngle = (p / layer.petals) * Math.PI * 2 + layer.angleOffset + jitter;
            const remaining = (p === layer.petals - 1) ? layer.count - p * perPetal : perPetal;
            // Petal-specific curvature variation (±15%)
            const archVar = layer.arch * (0.9 + Math.random() * 0.2);
            const recurveVar = layer.recurve * (0.85 + Math.random() * 0.3);

            for (let i = 0; i < remaining && idx < PARTICLE_COUNT; i++) {
                const t = Math.random(); // 0=base, 1=tip
                const s = (Math.random() - 0.5) * 2; // -1 to 1 across petal

                // Radial distance along spine
                const rSpine = layer.baseR + t * (layer.tipR - layer.baseR);
                // Arch/bulge outward in the middle of the petal
                const arch = Math.sin(t * Math.PI) * archVar;
                // Tip recurve: petal tip curls outward (quadratic ramp starting at t=0.55)
                const recurveT = Math.max(0, (t - 0.55) / 0.45);
                const recurve = recurveT * recurveT * recurveVar;
                const rEff = rSpine + arch + recurve;
                // Height with vertical bow and tip droop from recurve
                const bow = Math.sin(t * Math.PI * 0.8) * layer.bowHeight;
                const h = layer.baseH + t * (layer.tipH - layer.baseH) + bow - recurve * 0.4;
                // Width profile with slight asymmetry: petals wider on one side
                const asym = 1.0 + s * 0.06;
                const widthProfile = Math.pow(Math.sin(t * Math.PI), 0.55) * (1 - t * 0.3) * asym;
                // Twist: petals spiral slightly around center as they extend
                const twist = t * 0.15 * (p % 2 === 0 ? 1 : -1);
                const theta = petalAngle + s * widthProfile * layer.spread + twist;
                // Cup: edges bend inward (stronger at base, weaker at tip)
                const cup = s * s * layer.cup * (1 - t * 0.5);
                const rFinal = rEff - cup;
                // Tilt: petal leans outward as it extends upward
                const tiltAngle = t * layer.tilt;
                const rTilted = rFinal * Math.cos(tiltAngle) + h * Math.sin(tiltAngle);
                const yTilted = h * Math.cos(tiltAngle) - rFinal * Math.sin(tiltAngle);

                const y = yTilted + ROSE_CENTER_Y;
                const x = rTilted * Math.cos(theta);
                const z = rTilted * Math.sin(theta);

                positions[idx * 3] = x;
                positions[idx * 3 + 1] = y;
                positions[idx * 3 + 2] = z;

                const col = lerpColor(layer.colorStart, layer.colorEnd, t);
                colors[idx * 3] = col[0] / 255;
                colors[idx * 3 + 1] = col[1] / 255;
                colors[idx * 3 + 2] = col[2] / 255;
                types[idx] = 0;
                idx++;
            }
        }
    }

    // --- Sepals (花萼) 350 particles — organic tapered leaf-like shapes ---
    const sepalCount = 350;
    const sepalN = 5;
    const sepalPer = Math.floor(sepalCount / sepalN);
    // Sepal attachment: wraps around the flower receptacle
    const sepalBaseR = 0.90, sepalLen = 2.0, sepalBaseY = -1.2;
    // Rich green gradient: dark brownish-green base → vibrant green tip
    const sepalBaseCol = hexToRGB('#335522');
    const sepalMidCol  = hexToRGB('#007733');
    const sepalTipCol  = hexToRGB('#00aa55');
    for (let s = 0; s < sepalN && idx < PARTICLE_COUNT; s++) {
        // Stagger sepals between outer petals
        const angle = (s / sepalN) * Math.PI * 2 + Math.PI / 10;
        const cnt = (s === sepalN - 1) ? sepalCount - s * sepalPer : sepalPer;
        // Per-sepal variation
        const twistDir = (s % 2 === 0 ? 1 : -1) * (0.85 + Math.random() * 0.3);
        const sepalCup = 0.08 + Math.random() * 0.04;
        for (let i = 0; i < cnt && idx < PARTICLE_COUNT; i++) {
            const t = Math.random(); // 0=base, 1=tip
            const w = (Math.random() - 0.5) * 2; // across sepal (-1 to 1)
            // Width: widest at base, tapers to a fine point
            const widthProfile = (1 - t) * Math.pow(1 - t * t, 0.5);
            const widthAtT = widthProfile * 0.30;
            // Spine: curves outward and downward from attachment
            const rSpine = sepalBaseR + t * sepalLen;
            const archSpine = Math.sin(t * Math.PI * 0.7) * 0.5;
            const rEff = rSpine + archSpine;
            // Height: starts at base, drops downward
            const ySpine = ROSE_CENTER_Y + sepalBaseY - t * 1.0;
            // Slight droop at tip
            const yDroop = -Math.pow(t, 3) * 0.6;
            const y = ySpine + yDroop;
            // Twist: sepal twists slightly along its length
            const twist = t * 0.25 * twistDir;
            const theta = angle + w * widthAtT + twist;
            // Cup: edges curl inward slightly (like a tiny leaf folding)
            const cup = w * w * sepalCup * (1 - t);
            const r = rEff - cup;
            const x = r * Math.cos(theta);
            const z = r * Math.sin(theta);
            positions[idx * 3] = x;
            positions[idx * 3 + 1] = y;
            positions[idx * 3 + 2] = z;
            // Color: brownish base → rich green mid → bright green tip
            let col;
            if (t < 0.3) {
                col = lerpColor(sepalBaseCol, sepalMidCol, t / 0.3);
            } else {
                col = lerpColor(sepalMidCol, sepalTipCol, (t - 0.3) / 0.7);
            }
            colors[idx * 3] = col[0] / 255;
            colors[idx * 3 + 1] = col[1] / 255;
            colors[idx * 3 + 2] = col[2] / 255;
            types[idx] = 1;
            idx++;
        }
    }

    // --- Stem (花柄) 350 particles ---
    const stemCount = 350;
    const stemTop = ROSE_CENTER_Y - 1.6;
    const stemLen = 11;
    const stemThick = 0.22;
    for (let i = 0; i < stemCount && idx < PARTICLE_COUNT; i++) {
        const t = Math.random(); // 0=top, 1=bottom
        const y = stemTop - t * stemLen;
        const xOff = Math.sin(t * Math.PI * 0.9) * 0.4;
        const zOff = Math.cos(t * Math.PI * 0.55) * 0.25;
        const phi = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * stemThick;
        const x = xOff + r * Math.cos(phi);
        const z = zOff + r * Math.sin(phi);
        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = z;
        const ct = t;
        const col = lerpColor(PETAL_COLORS.stem, PETAL_COLORS.leaf, ct);
        colors[idx * 3] = col[0] / 255;
        colors[idx * 3 + 1] = col[1] / 255;
        colors[idx * 3 + 2] = col[2] / 255;
        types[idx] = 2;
        idx++;
    }

    // --- Leaves (花叶) 2 leaves, 150 each ---
    const leafDefs = [
        { stemT: 0.28, angle: Math.PI * 0.65, len: 2.8, width: 1.2, count: 150 },
        { stemT: 0.58, angle: -Math.PI * 0.55, len: 3.0, width: 1.3, count: 150 }
    ];

    function getStemPos(t) {
        const y = stemTop - t * stemLen;
        const xOff = Math.sin(t * Math.PI * 0.9) * 0.4;
        const zOff = Math.cos(t * Math.PI * 0.55) * 0.25;
        return { x: xOff, y: y, z: zOff };
    }

    for (const leafDef of leafDefs) {
        const stemPt = getStemPos(leafDef.stemT);
        const leafAngle = leafDef.angle;
        const lLen = leafDef.len;
        const lWidth = leafDef.width;

        for (let i = 0; i < leafDef.count && idx < PARTICLE_COUNT; i++) {
            const u = Math.random(); // along midrib
            const maxV = Math.sin(u * Math.PI) * (1 - u * 0.55);
            const v = (Math.random() - 0.5) * 2 * maxV;

            const along = u * lLen;
            const across = v * lWidth * 0.5;
            const bend = Math.sin(u * Math.PI) * 0.4 * (1 - Math.abs(v));

            const dx = Math.cos(leafAngle);
            const dz = Math.sin(leafAngle);
            const x = stemPt.x + along * dx + across * (-dz) * 0.7;
            const z = stemPt.z + along * dz + across * dx * 0.7;
            const y = stemPt.y + across * 0.5 + bend;

            positions[idx * 3] = x;
            positions[idx * 3 + 1] = y;
            positions[idx * 3 + 2] = z;

            const ct = 0.3 + u * 0.5 + Math.abs(v) * 0.2;
            const col = lerpColor(PETAL_COLORS.stem, PETAL_COLORS.leaf, Math.min(1, ct));
            colors[idx * 3] = col[0] / 255;
            colors[idx * 3 + 1] = col[1] / 255;
            colors[idx * 3 + 2] = col[2] / 255;
            types[idx] = 3;
            idx++;
        }
    }

    // Fill remaining with extra petal particles
    while (idx < PARTICLE_COUNT) {
        const layer = LAYER_DEFS[LAYER_DEFS.length - 1];
        const petalAngle = Math.random() * Math.PI * 2;
        const t = Math.random();
        const s = (Math.random() - 0.5) * 2;
        const rSpine = layer.baseR + t * (layer.tipR - layer.baseR);
        const arch = Math.sin(t * Math.PI) * layer.arch;
        const recurveT = Math.max(0, (t - 0.55) / 0.45);
        const recurve = recurveT * recurveT * layer.recurve;
        const rEff = rSpine + arch + recurve;
        const bow = Math.sin(t * Math.PI * 0.8) * layer.bowHeight;
        const h = layer.baseH + t * (layer.tipH - layer.baseH) + bow - recurve * 0.4;
        const asym = 1.0 + s * 0.06;
        const widthProfile = Math.pow(Math.sin(t * Math.PI), 0.55) * (1 - t * 0.3) * asym;
        const twist = t * 0.15 * (Math.random() > 0.5 ? 1 : -1);
        const theta = petalAngle + s * widthProfile * layer.spread + twist;
        const cup = s * s * layer.cup * (1 - t * 0.5);
        const rFinal = rEff - cup;
        const tiltAngle = t * layer.tilt;
        const rTilted = rFinal * Math.cos(tiltAngle) + h * Math.sin(tiltAngle);
        const yTilted = h * Math.cos(tiltAngle) - rFinal * Math.sin(tiltAngle);
        positions[idx * 3] = rTilted * Math.cos(theta);
        positions[idx * 3 + 1] = yTilted + ROSE_CENTER_Y;
        positions[idx * 3 + 2] = rTilted * Math.sin(theta);
        const col = lerpColor(layer.colorStart, layer.colorEnd, t);
        colors[idx * 3] = col[0] / 255;
        colors[idx * 3 + 1] = col[1] / 255;
        colors[idx * 3 + 2] = col[2] / 255;
        types[idx] = 0;
        idx++;
    }

    return { positions, colors, types };
}

// ==================== Scattered Positions ====================
function generateScatteredPositions() {
    const arr = new Float32Array(PARTICLE_COUNT * 3);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = SCATTER_INNER + Math.random() * (SCATTER_RADIUS - SCATTER_INNER);
        arr[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        arr[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) + ROSE_CENTER_Y;
        arr[i * 3 + 2] = r * Math.cos(phi);
    }
    return arr;
}

// ==================== Glow Texture ====================
function createGlowTexture() {
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const half = size / 2;
    const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.06, 'rgba(255,255,255,0.9)');
    gradient.addColorStop(0.2, 'rgba(255,255,255,0.55)');
    gradient.addColorStop(0.45, 'rgba(255,255,255,0.12)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(canvas);
}

// ==================== Easing ====================
function elasticOut(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    const c4 = (2 * Math.PI) / 3;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
}

// ==================== Three.js Setup ====================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 100);
camera.position.set(0, ROSE_CENTER_Y, 16);
camera.lookAt(0, ROSE_CENTER_Y, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);

// ==================== Create Particles ====================
const roseData = generateRoseGeometry();
const scatteredPositions = generateScatteredPositions();

// Current interpolated positions
const currentPositions = new Float32Array(PARTICLE_COUNT * 3);
currentPositions.set(scatteredPositions);

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(roseData.colors, 3));

const glowTex = createGlowTexture();
const material = new THREE.PointsMaterial({
    size: 0.14,
    map: glowTex,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true,
    transparent: true,
    opacity: 0.9
});

const roseGroup = new THREE.Group();
const points = new THREE.Points(geometry, material);
roseGroup.add(points);
scene.add(roseGroup);

// Subtle ambient particles for background stars
const bgStarCount = 600;
const bgGeom = new THREE.BufferGeometry();
const bgPositions = new Float32Array(bgStarCount * 3);
for (let i = 0; i < bgStarCount; i++) {
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    const r = 18 + Math.random() * 30;
    bgPositions[i * 3] = r * Math.sin(ph) * Math.cos(th);
    bgPositions[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
    bgPositions[i * 3 + 2] = r * Math.cos(ph);
}
bgGeom.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
const bgMat = new THREE.PointsMaterial({
    size: 0.08, map: glowTex, color: 0x334466,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    transparent: true, opacity: 0.5
});
const bgStars = new THREE.Points(bgGeom, bgMat);
scene.add(bgStars);

// --- Falling Petals ---
const fallingPetalCount = 80;
const fpGeom = new THREE.BufferGeometry();
const fpPositions = new Float32Array(fallingPetalCount * 3);
const fpVelocities = new Float32Array(fallingPetalCount * 3); // drift + fall speeds
const fpColors = new Float32Array(fallingPetalCount * 3);
const petalColors = [
    hexToRGB('#ff4488'), hexToRGB('#ff2266'), hexToRGB('#ee5577'),
    hexToRGB('#ff6699'), hexToRGB('#ff3366'), hexToRGB('#cc4466')
];
function resetFallingPetal(i) {
    const angle = Math.random() * Math.PI * 2;
    const r = 4 + Math.random() * 10;
    fpPositions[i * 3] = Math.cos(angle) * r;
    fpPositions[i * 3 + 1] = 5 + Math.random() * 8;
    fpPositions[i * 3 + 2] = Math.sin(angle) * r;
    fpVelocities[i * 3] = (Math.random() - 0.5) * 0.3;     // x drift
    fpVelocities[i * 3 + 1] = -(0.3 + Math.random() * 0.7); // y fall speed
    fpVelocities[i * 3 + 2] = (Math.random() - 0.5) * 0.3;  // z drift
    const col = petalColors[Math.floor(Math.random() * petalColors.length)];
    fpColors[i * 3] = col[0] / 255;
    fpColors[i * 3 + 1] = col[1] / 255;
    fpColors[i * 3 + 2] = col[2] / 255;
}
for (let i = 0; i < fallingPetalCount; i++) {
    resetFallingPetal(i);
    fpPositions[i * 3 + 1] = (Math.random() - 0.5) * 12; // stagger vertically
}
fpGeom.setAttribute('position', new THREE.BufferAttribute(fpPositions, 3));
fpGeom.setAttribute('color', new THREE.BufferAttribute(fpColors, 3));
const fpMat = new THREE.PointsMaterial({
    size: 0.10, map: glowTex, vertexColors: true,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true,
    transparent: true, opacity: 0.7
});
const fallingPetals = new THREE.Points(fpGeom, fpMat);
scene.add(fallingPetals);

// ==================== State ====================
let convergeFactor = 0; // 0=scattered, 1=rose (initial animation progress)
let spreadFactor = 0; // 0=fist(rose), 1=open(scattered) from gesture
let rotationSpeed = 0; // from gesture
let targetRotationSpeed = 0;
let targetSpreadFactor = 0;
let initialAnimStart = 0;
let initialAnimDone = false;
let useGesture = false;
let gestureActive = false;
let lastHandDataTime = 0;
let cameraReady = false;

// Mouse state
let mouseDown = false;
let mousePrev = { x: 0, y: 0 };
let mouseRotationY = 0;
let mouseRotationX = 0;
let mouseZoom = 14;
let gestureZoom = 14;     // zoom from hand distance
let targetGestureZoom = 14;

// ==================== Camera Distance (zoom) ====================
function updateCameraDistance() {
    const targetZ = (useGesture && gestureActive) ? gestureZoom : mouseZoom;
    camera.position.z += (targetZ - camera.position.z) * 0.08;
    camera.lookAt(0, ROSE_CENTER_Y, 0);
}

// ==================== Animation Loop ====================
const clock = new THREE.Clock();

function animate(timestamp) {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.1);
    const elapsed = timestamp * 0.001;

    // Initial convergence animation
    if (!initialAnimDone) {
        if (initialAnimStart === 0) initialAnimStart = timestamp;
        const animT = (timestamp - initialAnimStart) / INITIAL_ANIM_DURATION;
        convergeFactor = elasticOut(Math.min(1, animT));
        if (animT >= 1) {
            initialAnimDone = true;
            convergeFactor = 1;
        }
    }

    // Gesture timeout fallback: if no hand data for 1.5s, reset to neutral
    if (useGesture && gestureActive && timestamp - lastHandDataTime > 1500) {
        targetSpreadFactor = 0;
        targetRotationSpeed = 0;
        gestureActive = false;
        updateCameraIndicator('inactive');
    }

    // Smooth spread factor transition
    const spreadSpeed = 4.0;
    if (Math.abs(targetSpreadFactor - spreadFactor) < 0.001) {
        spreadFactor = targetSpreadFactor;
    } else {
        spreadFactor += (targetSpreadFactor - spreadFactor) * Math.min(spreadSpeed * dt, 1);
    }

    // Smooth rotation speed transition
    const rotSmooth = 3.0;
    rotationSpeed += (targetRotationSpeed - rotationSpeed) * Math.min(rotSmooth * dt, 1);

    // Update particle positions
    const factor = convergeFactor * (1 - spreadFactor);
    const posArr = geometry.attributes.position.array;
    for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        posArr[i] = scatteredPositions[i] + (roseData.positions[i] - scatteredPositions[i]) * factor;
    }
    geometry.attributes.position.needsUpdate = true;

    // Rotation — both gesture and mouse apply incremental updates to roseGroup
    if (useGesture && gestureActive) {
        roseGroup.rotation.y += rotationSpeed * dt;
    }
    // Mouse rotation is applied directly in mousemove/touchmove handlers

    // Breathing animation
    const breathe = 1 + Math.sin(elapsed * (2 * Math.PI) / BREATH_PERIOD) * BREATH_AMPLITUDE;
    roseGroup.scale.setScalar(breathe);

    // Slow background star rotation
    bgStars.rotation.y += dt * 0.03;
    bgStars.rotation.x += dt * 0.015;

    // Gesture zoom smoothing
    gestureZoom += (targetGestureZoom - gestureZoom) * Math.min(3.0 * dt, 1);
    // Camera zoom
    updateCameraDistance();

    // Update falling petals
    const fpArr = fpGeom.attributes.position.array;
    for (let i = 0; i < fallingPetalCount; i++) {
        fpArr[i * 3] += fpVelocities[i * 3] * dt;
        fpArr[i * 3 + 1] += fpVelocities[i * 3 + 1] * dt;
        fpArr[i * 3 + 2] += fpVelocities[i * 3 + 2] * dt;
        // Sway: gentle sinusoidal drift
        fpArr[i * 3] += Math.sin(elapsed * 1.3 + i * 0.7) * dt * 0.15;
        fpArr[i * 3 + 2] += Math.cos(elapsed * 1.1 + i * 0.5) * dt * 0.12;
        // Reset petal that fell below view
        if (fpArr[i * 3 + 1] < -8) {
            fpArr[i * 3 + 1] = 5 + Math.random() * 4;
            fpArr[i * 3] = (Math.random() - 0.5) * 14;
            fpArr[i * 3 + 2] = (Math.random() - 0.5) * 14;
        }
    }
    fpGeom.attributes.position.needsUpdate = true;
    // Subtle sparkle: vary falling petal opacity over time
    fpMat.opacity = 0.55 + Math.sin(elapsed * 2.5) * 0.15;

    // Sparkle on rose particles: subtle size pulse
    material.size = 0.14 + Math.sin(elapsed * 3.0) * 0.015;

    renderer.render(scene, camera);
}

// ==================== Mouse Fallback ====================
function setupMouse() {
    renderer.domElement.addEventListener('mousedown', (e) => {
        mouseDown = true;
        mousePrev.x = e.clientX;
        mousePrev.y = e.clientY;
    });

    window.addEventListener('mouseup', () => { mouseDown = false; });

    window.addEventListener('mousemove', (e) => {
        if (!mouseDown || useGesture) return;
        const dx = e.clientX - mousePrev.x;
        const dy = e.clientY - mousePrev.y;
        roseGroup.rotation.y += dx * 0.005;
        roseGroup.rotation.x += dy * 0.005;
        roseGroup.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, roseGroup.rotation.x));
        mousePrev.x = e.clientX;
        mousePrev.y = e.clientY;
    });

    renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        mouseZoom += e.deltaY * 0.01;
        mouseZoom = Math.max(6, Math.min(30, mouseZoom));
    }, { passive: false });

    // Touch support
    renderer.domElement.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            mouseDown = true;
            mousePrev.x = e.touches[0].clientX;
            mousePrev.y = e.touches[0].clientY;
        }
    });
    window.addEventListener('touchend', () => { mouseDown = false; });
    window.addEventListener('touchmove', (e) => {
        if (!mouseDown || useGesture || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - mousePrev.x;
        const dy = e.touches[0].clientY - mousePrev.y;
        roseGroup.rotation.y += dx * 0.005;
        roseGroup.rotation.x += dy * 0.005;
        roseGroup.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, roseGroup.rotation.x));
        mousePrev.x = e.touches[0].clientX;
        mousePrev.y = e.touches[0].clientY;
    });
}

// ==================== MediaPipe Hands Setup ====================
function updateCameraIndicator(status) {
    cameraPrompt.classList.remove('hidden');
    camDot.className = 'dot ' + status;
    if (status === 'active') {
        camText.textContent = '手势识别已激活';
    } else if (status === 'inactive') {
        camText.textContent = '未检测到手势 — 使用鼠标控制';
    } else if (status === 'fallback') {
        camText.textContent = '摄像头不可用 — 使用鼠标控制';
    } else if (status === 'connecting') {
        camText.textContent = '正在连接摄像头...';
    }
}

function setupMediaPipe() {
    if (typeof Hands === 'undefined') {
        updateCameraIndicator('fallback');
        return;
    }

    const videoEl = document.createElement('video');
    videoEl.setAttribute('playsinline', '');
    videoEl.setAttribute('autoplay', '');
    videoEl.style.display = 'none';
    document.body.appendChild(videoEl);

    const hands = new Hands({
        locateFile: (file) =>
            'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + file
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const lm = results.multiHandLandmarks[0];
            lastHandDataTime = performance.now();
            gestureActive = true;
            useGesture = true;
            updateCameraIndicator('active');

            // Palm/fist: ratio of tip→wrist / mcp→wrist (scale-invariant).
            // Curled finger: tip near MCP → ratio ≈ 0.85–1.05.
            // Extended finger: tip far beyond MCP → ratio ≈ 1.4–2.2.
            // pow(x, 2.0) strongly suppresses low values → fist maps to ~0.
            const wrist = lm[0];
            const middleMcp = lm[9];
            const handScale = Math.hypot(
                middleMcp.x - wrist.x,
                middleMcp.y - wrist.y,
                middleMcp.z - wrist.z
            );
            if (handScale > 0.01) {
                // 4 fingers (skip thumb — it wraps around the fist)
                const pairs = [[8,5], [12,9], [16,13], [20,17]];
                let avgRatio = 0;
                for (const [tipId, mcpId] of pairs) {
                    const tip = lm[tipId];
                    const mcp = lm[mcpId];
                    const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y, tip.z - wrist.z);
                    const mcpDist = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y, mcp.z - wrist.z);
                    avgRatio += mcpDist > 0.001 ? tipDist / mcpDist : 1.5;
                }
                avgRatio /= 4;
                // Fist: avgRatio ≈ 0.88–1.08.  Open: ≈ 1.40–2.20.
                const raw = Math.max(0, Math.min(1, (avgRatio - 0.84) / 0.70));
                targetSpreadFactor = Math.pow(raw, 2.0);
            }

            // Hand distance → zoom: bigger hand (closer to camera) → zoom in
            const scaleClamped = Math.max(0.04, Math.min(0.35, handScale));
            const zoomT = (scaleClamped - 0.04) / 0.31; // 0=far, 1=close
            targetGestureZoom = 22 - zoomT * 16; // far=22, close=6

            // Compute hand horizontal position for rotation
            const wristX = wrist.x; // 0=left, 1=right
            const deadZone = 0.1;
            if (wristX < 0.4) {
                targetRotationSpeed = -((0.4 - wristX) / 0.4) * MAX_ROTATION_SPEED;
            } else if (wristX > 0.6) {
                targetRotationSpeed = ((wristX - 0.6) / 0.4) * MAX_ROTATION_SPEED;
            } else {
                targetRotationSpeed = 0;
            }
        } else {
            // No hand detected — graceful hold of last values
            if (performance.now() - lastHandDataTime > 2000) {
                gestureActive = false;
                updateCameraIndicator('inactive');
            }
        }
    });

    // Try to use Camera utility, fall back to manual
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480, facingMode: 'user' }
            });
            videoEl.srcObject = stream;
            await videoEl.play();
            cameraReady = true;

            // Manual frame processing loop
            function processFrame() {
                if (videoEl.readyState >= 2) {
                    hands.send({ image: videoEl }).catch(() => {});
                }
                requestAnimationFrame(processFrame);
            }
            processFrame();
            updateCameraIndicator('active');
        } catch (err) {
            console.warn('Camera access failed:', err.message);
            updateCameraIndicator('fallback');
            useGesture = false;
        }
    }

    // Also try the Camera utility if available
    if (typeof Camera !== 'undefined') {
        try {
            const mpCamera = new Camera(videoEl, {
                onFrame: async () => {
                    await hands.send({ image: videoEl });
                },
                width: 640,
                height: 480
            });
            mpCamera.start().then(() => {
                cameraReady = true;
                updateCameraIndicator('active');
            }).catch(() => {
                startCamera();
            });
        } catch (e) {
            startCamera();
        }
    } else {
        startCamera();
    }
}

// ==================== Window Resize ====================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ==================== Keyboard Shortcuts ====================
window.addEventListener('keydown', (e) => {
    switch (e.key.toLowerCase()) {
        case 'r':
            // Reset view
            roseGroup.rotation.y = 0;
            roseGroup.rotation.x = 0;
            mouseZoom = 14;
            targetSpreadFactor = 0;
            targetRotationSpeed = 0;
            break;
        case 'f':
            // Toggle fullscreen
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.body.requestFullscreen().catch(() => {});
            }
            break;
        case '1':
            targetSpreadFactor = 0; // Force rose shape
            break;
        case '2':
            targetSpreadFactor = 1; // Force scattered
            break;
    }
});

// ==================== Init ====================
function init() {
    setupMouse();
    setupMediaPipe();

    // Start animation
    requestAnimationFrame(animate);

    // Hide loading overlay after a short delay
    setTimeout(() => {
        loadingOverlay.classList.add('hidden');
        // Remove overlay after transition
        setTimeout(() => {
            if (loadingOverlay.parentNode) {
                loadingOverlay.parentNode.removeChild(loadingOverlay);
            }
        }, 700);
    }, 800);
}

// Start when DOM is ready
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

})();
</script>
